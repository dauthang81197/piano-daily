# Piano Daily — production trên một VPS Linux. Triển khai bằng GitHub Actions (.github/workflows/ci-cd.yml):
# image đã build sẵn trên Docker Hub, server chỉ `pull` và `up`. Cấu hình bí mật nằm ở `.env` TRÊN SERVER (không có trong repo).
#   cd /opt/piano-daily && IMAGE_TAG=sha-abc1234 docker compose -f docker-compose.prod.yml up -d
# Không publish cổng nào ra host: Nginx Proxy Manager (NPM) có sẵn trên server giữ 80/443 và làm TLS + reverse proxy.
# web/admin/api tham gia thêm network của NPM (biến NPM_NETWORK trong .env) với alias piano-web / piano-admin / piano-api;
# Postgres chỉ nằm trong mạng nội bộ của compose. Proxy Host cần tạo trong NPM: xem README mục "CI/CD và deploy".
# Chỉ chạy MỘT instance API (rate limit và dedupe lượt xem ở bộ nhớ trong, AD-15). File lưu ở Cloudflare R2, không có SeaweedFS.
name: piano-daily

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-piano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-piano_daily}
    volumes:
      # Postgres 18 lưu dữ liệu dưới /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKERHUB_USERNAME:?Thiếu DOCKERHUB_USERNAME}/piano-daily-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-piano}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-piano_daily}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Thiếu JWT_ACCESS_SECRET trong .env}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ADMIN_ORIGIN: https://admin.${SITE_HOST:?Thiếu SITE_HOST trong .env}
      CORS_WEB_ORIGIN: https://${SITE_HOST}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Thiếu INTERNAL_API_SECRET trong .env}
      VIEW_SALT: ${VIEW_SALT:?Thiếu VIEW_SALT trong .env}
      WEB_INTERNAL_URL: http://web:4100
      # Chuyển PDF sang MIDI: dịch vụ musicscore (project riêng, alias piano-musicscore trên network của NPM). Đặt MUSICSCORE_URL= (rỗng) để tắt tính năng.
      MUSICSCORE_URL: ${MUSICSCORE_URL-http://piano-musicscore:3000}
      SCORE_DAILY_LIMIT: ${SCORE_DAILY_LIMIT:-10}
      # PayPal (Story 3.3, 3.8): thiếu client id/secret thì tạo đơn trả 503; thiếu webhook id thì POST /webhooks/paypal trả 503.
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      # Đăng nhập Google của khách (tuỳ chọn): thiếu thì nút Google bị ẩn.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # VietQR qua SePay (tuỳ chọn): thiếu thì VietQR không khả dụng.
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-}
      SEPAY_ACCOUNT_HOLDER: ${SEPAY_ACCOUNT_HOLDER:-}
      # Email link tải (Story 3.7): thiếu khoá Resend thì API bỏ qua việc gửi email (chỉ log cảnh báo).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SITE_URL: https://${SITE_HOST}
      # Cloudflare R2: bucket tạo sẵn trước (không tự tạo), bucket public bật truy cập công khai (r2.dev hoặc custom domain).
      S3_ENDPOINT: ${S3_ENDPOINT:?Thiếu S3_ENDPOINT trong .env}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Thiếu S3_ACCESS_KEY_ID trong .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Thiếu S3_SECRET_ACCESS_KEY trong .env}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:?Thiếu S3_BUCKET_PUBLIC trong .env}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:?Thiếu S3_BUCKET_PRIVATE trong .env}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?Thiếu S3_PUBLIC_BASE_URL trong .env}
      S3_FORCE_PATH_STYLE: 'true'
      S3_AUTO_CREATE_BUCKETS: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases: [piano-api]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    image: ${DOCKERHUB_USERNAME}/piano-daily-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases: [piano-web]

  admin:
    image: ${DOCKERHUB_USERNAME}/piano-daily-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases: [piano-admin]

volumes:
  postgres-data:

networks:
  # Network có sẵn của Nginx Proxy Manager. Xem tên bằng:
  #   docker inspect nginx-proxy-manager --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}'
  proxy:
    external: true
    name: ${NPM_NETWORK:?Thiếu NPM_NETWORK trong .env (tên network của Nginx Proxy Manager)}
