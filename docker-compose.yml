# Piano Daily — môi trường local: `docker compose up -d --build`
# Chế độ dev nhanh (hot reload trên host): `docker compose up -d postgres seaweedfs` rồi `pnpm dev`.
# Test tích hợp: `docker compose up -d --wait seaweedfs && docker compose --profile test up -d --wait postgres-test` rồi `pnpm test`.
name: piano-daily

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-piano}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piano}

services:
  postgres:
    image: postgres:18.6
    environment:
      <<: *postgres-env
      POSTGRES_DB: ${POSTGRES_DB:-piano_daily}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 lưu dữ liệu dưới /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18.6
    profiles: ['test']
    environment:
      <<: *postgres-env
      POSTGRES_DB: piano_daily_test
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # S3 identity (access key/secret khớp .env.example) và quyền đọc ẩn danh CHỈ cho bucket public
    # (`piano-daily-public`, `piano-daily-test-public`). Bucket private không đọc ẩn danh được.
    # Mỗi bucket là một collection và SeaweedFS cấp trước vài volume cho mỗi collection: nâng số volume tối đa
    # và thu nhỏ volume (64MB) để đủ chỗ cho 4 bucket (dev + test) trên máy local.
    command:
      - server
      - -dir=/data
      - -volume.max=100
      - -master.volumeSizeLimitMB=64
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333' # S3 API
      - '9333:9333' # master (UI/status)
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-piano}:${POSTGRES_PASSWORD:-piano}@postgres:5432/${POSTGRES_DB:-piano_daily}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Thiếu JWT_ACCESS_SECRET trong .env (xem .env.example)}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      # Origin duy nhất được CORS cho phép (kèm credentials): admin app.
      CORS_ADMIN_ORIGIN: ${CORS_ADMIN_ORIGIN:-http://localhost:4101}
      # Origin web (CORS, không credentials) và secret web SSR dùng để bỏ qua throttle.
      CORS_WEB_ORIGIN: ${CORS_WEB_ORIGIN:-http://localhost:4100}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Thiếu INTERNAL_API_SECRET trong .env (xem .env.example)}
      # Muối băm visitor_hash của bộ đếm lượt xem (Story 2.7); chỉ API đọc.
      VIEW_SALT: ${VIEW_SALT:?Thiếu VIEW_SALT trong .env (xem .env.example)}
      # PayPal (Story 3.3): sandbox mặc định; thiếu client id/secret thì tạo đơn trả 503.
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      # Email link tải (Story 3.7): thiếu khoá Resend thì bỏ qua việc gửi; SITE_URL trống thì dùng CORS_WEB_ORIGIN.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SITE_URL: ${SITE_URL:-}
      # API gọi POST /api/revalidate của web khi admin đổi nội dung (Story 2.3).
      WEB_INTERNAL_URL: http://web:4100
      # Object storage (module `media`): API gọi SeaweedFS qua mạng nội bộ; trình duyệt đọc bucket public qua localhost.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-piano}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-piano-secret}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-piano-daily-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-piano-daily-private}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:8333/piano-daily-public}
      S3_FORCE_PATH_STYLE: 'true'
      # Local: tạo bucket còn thiếu lúc khởi động. Production (R2) để false và tạo bucket trước.
      S3_AUTO_CREATE_BUCKETS: 'true'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inline vào bundle / CSP lúc build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-http://localhost:8333/piano-daily-public}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4100}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        # Client ID công khai của PayPal (không phải secret); để trống thì modal thanh toán báo chưa cấu hình.
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
    environment:
      API_INTERNAL_URL: http://api:4000
      # Chỉ server đọc; không bao giờ đặt tiền tố NEXT_PUBLIC_.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Thiếu INTERNAL_API_SECRET trong .env (xem .env.example)}
    ports:
      - '4100:4100'
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Inline vào bundle lúc build: URL API mà trình duyệt (trên host) gọi.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        # URL gốc công khai của web, để nút "Xem như người dùng" mở trang xem trước.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4100}
    ports:
      - '4101:4101'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  seaweedfs-data:
